[package]
name = "storyagent"
version = "0.1.29"
description = "Agent novel writing desktop application"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "storyagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "~2.14.1"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "multipart", "socks"] }
reqwest_updater = { package = "reqwest", version = "~0.13.5", default-features = false, features = ["socks"] }
hyper-util = { version = "~0.1.21", default-features = false, features = ["client-proxy"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
scraper = "0.24"
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
system-configuration = "0.7"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
