name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate version and signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '::error::Configure TAURI_SIGNING_PRIVATE_KEY in repository secrets'; exit 1; }
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateReleaseVersion } from './scripts/updater-manifest.mjs';
          import { releaseRecord } from './src/changelog.mjs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          validateReleaseVersion(process.env.RELEASE_TAG, [pkg.version, config.version, cargo]);
          releaseRecord(readFileSync('CHANGELOG.md', 'utf8'), pkg.version);
          NODE
      - name: Prepare draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { readFile } = await import('node:fs/promises');
            const { releaseRecord, releaseNotes } = await import(`${process.env.GITHUB_WORKSPACE}/src/changelog.mjs`);
            const body = releaseNotes(releaseRecord(await readFile('CHANGELOG.md', 'utf8'), tag.slice(1)));
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
              if (!release.draft) throw new Error('This version is already published; create a new version tag.');
              await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, body });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({ ...context.repo, tag_name: tag,
                name: `StoryAgent ${tag}`, draft: true, prerelease: tag.includes('-'), body })).data;
            }
            return release.id;

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils
      - run: npm ci
      - run: npm test
      - name: Build and upload signed bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][setup][ext]'
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate complete updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --pattern '*.app.tar.gz*' --pattern '*.AppImage*' --pattern '*-setup.exe*' --dir "$RUNNER_TEMP/updater-assets"
          node scripts/updater-manifest.mjs "$RUNNER_TEMP/updater-assets" "$RUNNER_TEMP/latest.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/latest.json" --clobber
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false
